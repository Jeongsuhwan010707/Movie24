<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>
<body>
<!-- 로그인 없이 예매 흐름(상영시간표/좌석선택/결제)을 진행하려 할 때 띄우는 공용 로그인 모달.
     로그인 성공 시 호출한 쪽의 콜백을 이어서 실행한다(js/loginModal.js 참고). -->
<div th:fragment="loginModal" id="loginModalOverlay" class="login-modal-overlay">
    <div class="login-modal">
        <button type="button" id="loginModalClose" class="login-modal-close" aria-label="닫기">&times;</button>
        <h2 class="login-modal-title">로그인이 필요합니다</h2>
        <p class="login-modal-desc">계속 진행하려면 로그인해주세요.</p>
        <div id="loginModalError" class="login-modal-error"></div>
        <form id="loginModalForm">
            <input type="text" id="loginModalId" class="login-modal-input" placeholder="아이디를 입력해주세요." autocomplete="username" required>
            <input type="password" id="loginModalPassword" class="login-modal-input" placeholder="비밀번호를 입력해주세요." autocomplete="current-password" required>
            <button type="submit" id="loginModalSubmit" class="login-modal-submit">로그인</button>
        </form>
        <a th:href="@{/login}" class="login-modal-fulllink">아이디/비밀번호 찾기 · 회원가입</a>
    </div>
</div>
</body>
</html>
