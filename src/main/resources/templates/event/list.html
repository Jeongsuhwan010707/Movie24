<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{/resources/images/logo/movie24-favicon.png}">
    <title>이벤트 - Movie24</title>
    <link rel="stylesheet" th:href="@{/resources/css/include/header.css}">
    <link rel="stylesheet" th:href="@{/resources/css/include/nav.css}">
    <link rel="stylesheet" th:href="@{/resources/css/include/footer.css}">
    <link rel="stylesheet" th:href="@{/resources/css/event/list.css}">
</head>
<body>
<div>
    <div th:replace="fragment/header.html :: header"></div>
    <div th:replace="fragment/nav.html :: nav"></div>
    <main>
        <div class="breadcrumb">
            <a th:href="@{/}">홈</a> <span>&gt;</span> <span class="current">이벤트</span>
        </div>
        <h2 class="pageTitle">이벤트</h2>

        <div class="filterBar">
            <div class="statusTabs">
                <a th:href="@{/events(tab='ongoing')}"
                   th:classappend="${selectedTab == 'ongoing'} ? 'active' : ''" class="tab">진행중인 이벤트</a>
                <a th:href="@{/events(tab='winner')}"
                   th:classappend="${selectedTab == 'winner'} ? 'active' : ''" class="tab">당첨자 발표</a>
                <a th:href="@{/events(tab='ended')}"
                   th:classappend="${selectedTab == 'ended'} ? 'active' : ''" class="tab">종료된 이벤트</a>
            </div>
        </div>

        <p class="emptyMessage" th:if="${#lists.isEmpty(events)}">해당하는 이벤트가 없습니다.</p>

        <div class="eventGrid" th:unless="${#lists.isEmpty(events)}">
            <a class="eventCard" th:each="event : ${events}" th:href="@{/events/{id}(id=${event.id})}">
                <div class="thumbBox">
                    <img class="thumb" th:src="${event.thumbnailUrl}" th:alt="${event.title}">
                    <span class="statusBadge" th:classappend="${event.status.name() == 'ONGOING'} ? 'ongoing' : 'ended'"
                          th:text="${event.status.name() == 'ONGOING'} ? '진행중' : '종료'">진행중</span>
                    <span class="winnerBadge" th:if="${event.winnerAnnounced}">당첨자 발표</span>
                </div>
                <h3 class="eventTitle" th:text="${event.title}">이벤트 제목</h3>
                <p class="eventPeriod" th:if="${event.startDate != null and event.endDate != null}"
                   th:text="${#temporals.format(event.startDate, 'yyyy.MM.dd') + ' ~ ' + #temporals.format(event.endDate, 'yyyy.MM.dd')}">기간</p>
            </a>
        </div>

        <div class="pagination" th:if="${totalPages > 1}">
            <a th:if="${currentPage > 1}"
               th:href="@{/events(tab=${selectedTab}, page=${currentPage - 1})}" class="pageArrow">&lt;</a>
            <a th:each="p : ${#numbers.sequence(1, totalPages)}"
               th:href="@{/events(tab=${selectedTab}, page=${p})}"
               th:text="${p}"
               th:classappend="${p == currentPage} ? 'current' : ''" class="pageNum"></a>
            <a th:if="${currentPage < totalPages}"
               th:href="@{/events(tab=${selectedTab}, page=${currentPage + 1})}" class="pageArrow">&gt;</a>
        </div>
    </main>
    <div th:replace="fragment/footer.html :: footer"></div>
</div>
<script th:src="@{/resources/js/nav.js}"></script>
</body>
</html>
