<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{/resources/images/logo/movie24-favicon.png}">
    <title>Movie24</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/resources/css/include/header.css}">
    <link rel="stylesheet" th:href="@{/resources/css/include/nav.css}">
    <link rel="stylesheet" th:href="@{/resources/css/include/footer.css}">
    <link rel="stylesheet" th:href="@{/resources/css/include/loginModal.css}">
    <link rel="stylesheet" th:href="@{/resources/css/movieReservation/pay.css}">
</head>
<body>
<div>
    <div th:replace="fragment/header.html :: header"></div>
    <!-- 네비게이터 영역 -->
    <div th:replace="fragment/nav.html :: nav"></div>
    <div th:replace="fragment/loginModal.html :: loginModal"></div>
    <main>
    <div id="main-left">
        <div id="main_text">
            <p>관람권 및 포인트 할인적용</p>
        </div>
        <div class="selectsale">
            <p>Movie24 관람권/기프티콘</p><img src="/resources/images/down-arrow.png" alt="">
        </div>
        <div class="selectsaleContent">
            <ul class="saleOptionList">
                <li><label><input type="radio" name="ticketSale" checked>사용 안함</label><span>0원</span></li>
                <li><label><input type="radio" name="ticketSale">Movie24 관람권 1매</label><span>-14,000원</span></li>
                <li><label><input type="radio" name="ticketSale">모바일 기프티콘</label><span>-10,000원</span></li>
            </ul>
        </div>
        <div class="selectsale">
            <p>Movie24 포인트/쿠폰</p><img src="/resources/images/down-arrow.png" alt="">
        </div>
        <div class="selectsaleContent">
            <ul class="saleOptionList">
                <li><label><input type="radio" name="pointSale" checked>사용 안함</label><span>0원</span></li>
                <li><label><input type="radio" name="pointSale">보유 포인트 전액 사용</label><span>-2,500P</span></li>
                <li><label><input type="radio" name="pointSale">Movie24 5,000원 할인쿠폰</label><span>-5,000원</span></li>
            </ul>
        </div>
        <div class="selectsale">
            <p>Vip 할인</p><img src="/resources/images/down-arrow.png" alt="">
        </div>
        <div class="selectsaleContent">
            <ul class="saleOptionList">
                <li><label><input type="radio" name="vipSale" checked>사용 안함</label><span>0원</span></li>
                <li><label><input type="radio" name="vipSale">VIP 골드 할인</label><span>-3,000원</span></li>
                <li><label><input type="radio" name="vipSale">VIP 블랙 할인</label><span>-5,000원</span></li>
            </ul>
        </div>
        <div class="paySectionDivider"></div>
        <div id="payment-method"></div>
        <div id="agreement"></div>
    </div>
    <div id="main-right">
        <div id="price1">
            <img class="ageBadge" th:src="@{'/resources/images/' + ${showtime.movie.ageRating.imageFileName}}" alt="">
            <h3 th:text="${showtime.movie.title} + ' (' + ${showtime.screen.screenType} + ')'">영화(2D)</h3>
        </div>
        <div id="price2">
            <div id="price2-1">
                <p th:text="${showtime.screen.theater.name}">극장</p>
                <p th:text="${showtime.screen.name}">관</p>
                <p th:text="${#temporals.format(showtime.startTime, 'yyyy.MM.dd')}">날짜</p>
                <p th:text="${#temporals.format(showtime.startTime, 'HH:mm')}">시간</p>
            </div>
            <div id="price2-2">
                <img th:src="${showtime.movie.posterImageUrl}" alt="">
            </div>
        </div>
        <div id="price3">
            <div id="price3-1">
                <p id="adult" th:text="${ticketSummary}">성인1</p>
                <p th:text="${showtime.basePrice} + '원 x ' + ${#lists.size(seats)} + '매'">14000원 x 1매</p>
            </div>
            <div id="price3-2">
                <h3 id="real_price">금액</h3>
                <h3 th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')} + '원'">14,000원</h3>
                <img src="/resources/images/minus (1).png" alt="">
            </div>
            <div id="price3-3">
                <h3 id="disCount">할인적용</h3>
                <h3>0원</h3>
            </div>
        </div>
        <div class="price4 price-new price4-first">
            <p class="price4-1 price4-1-new">VIP 할인</p>
            <p class="price4-2 price4-2-new">0원</p>
        </div>
        <div class="price4 price_4">
            <div class="price4-1">
                최종결제금액
            </div>
            <div class="price4-2">
                <p class="price-number2">원</p>
                <p id="price-number1" th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')}">14,000</p>
            </div>
        </div>
        <div id="price5">
            <div id="price5-1-1"><a id="price5-1" th:href="@{/movieReservation/seat(showtimeId=${showtime.id})}">이전</a></div>
            <div id="price5-2-2"><a id="price5-2" href="#" onclick="requestTossPayment(); return false;">다음</a></div>
        </div>
    </div>
</main>
    <!-- --------------------푸터---------------------------------- -->
    <div th:replace="fragment/footer.html :: footer"></div>
</div>
<script th:src="@{/resources/js/nav.js}"></script>
<script th:src="@{/resources/js/loginModal.js}"></script>
<script src="https://js.tosspayments.com/v2/standard"></script>
<script th:inline="javascript">
    var showtimeId = /*[[${showtime.id}]]*/ 0;
    var seatIdsCsv = /*[[${seatIdsCsv}]]*/ '';
    var totalPrice = /*[[${totalPrice}]]*/ 0;
    var tossClientKey = /*[[${tossClientKey}]]*/ '';

    var tossWidgets = TossPayments(tossClientKey).widgets({customerKey: TossPayments.ANONYMOUS});

    (async function initPaymentWidget() {
        await tossWidgets.setAmount({currency: 'KRW', value: totalPrice});
        await Promise.all([
            tossWidgets.renderPaymentMethods({selector: '#payment-method', variantKey: 'DEFAULT'}),
            tossWidgets.renderAgreement({selector: '#agreement', variantKey: 'AGREEMENT'})
        ]);
    })();

    function requestTossPayment() {
        requireLogin(proceedToPayment);
    }

    function proceedToPayment() {
        var csrfToken = document.querySelector('meta[name="_csrf"]').content;
        var csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
        var headers = {'Content-Type': 'application/json'};
        headers[csrfHeader] = csrfToken;

        fetch('/api/payments/prepare', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({
                showtimeId: showtimeId,
                seatIds: seatIdsCsv.split(',').map(Number)
            })
        }).then(function (res) {
            if (res.status === 401 || res.status === 403) {
                alert('로그인이 필요합니다.');
                location.href = '/login?redirectURL=' + encodeURIComponent(location.href);
                return;
            }
            return res.json().then(function (data) {
                if (!res.ok) {
                    alert(data.message || '결제 준비에 실패했습니다.');
                    return;
                }
                tossWidgets.setAmount({currency: 'KRW', value: data.amount}).then(function () {
                    tossWidgets.requestPayment({
                        orderId: data.orderId,
                        orderName: data.orderName,
                        successUrl: location.origin + '/movieReservation/payRedirect',
                        failUrl: location.href
                    }).catch(function (err) {
                        if (err.code !== 'USER_CANCEL') {
                            alert(err.message || '결제 요청 중 오류가 발생했습니다.');
                        }
                    });
                });
            });
        }).catch(function () {
            alert('결제 준비 중 오류가 발생했습니다.');
        });
    }

    (function showPayErrorIfAny() {
        var params = new URLSearchParams(location.search);
        var payError = params.get('payError');
        if (payError) {
            alert(payError);
            params.delete('payError');
            history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params.toString() : ''));
        }
    })();

    document.querySelectorAll('.selectsale').forEach(function (header) {
        var content = header.nextElementSibling;
        header.addEventListener('click', function () {
            var isOpen = content.classList.contains('open');

            document.querySelectorAll('.selectsaleContent.open').forEach(function (openContent) {
                if (openContent !== content) {
                    openContent.classList.remove('open');
                    openContent.style.maxHeight = null;
                    openContent.previousElementSibling.classList.remove('active');
                }
            });

            if (isOpen) {
                content.classList.remove('open');
                content.style.maxHeight = null;
                header.classList.remove('active');
            } else {
                content.classList.add('open');
                content.style.maxHeight = content.scrollHeight + 'px';
                header.classList.add('active');
            }
        });
    });
</script>
</body>
</html>
