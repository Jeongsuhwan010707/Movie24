<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" th:href="@{/resources/images/logo/movie24-favicon.png}">
  <title>ID / PW 찾기</title>
  <link rel="stylesheet" th:href="@{/resources/css/include/header.css}">
  <link rel="stylesheet" th:href="@{/resources/css/include/nav.css}">
  <link rel="stylesheet" th:href="@{/resources/css/include/footer.css}">
  <link rel="stylesheet" th:href="@{/resources/css/users/findAccount.css}">
</head>
<body>
<div>
  <div th:replace="fragment/header.html :: header"></div>
  <div th:replace="fragment/nav.html :: nav"></div>
  <main>
    <div id="find_area">
      <div id="find_logo">
        <h1>ID / PW 찾기</h1>
      </div>

      <div id="find_tabs">
        <button type="button" class="tab_btn" id="tabBtn-id">아이디 찾기</button>
        <button type="button" class="tab_btn" id="tabBtn-pw">비밀번호 찾기</button>
      </div>

      <div id="find_panels">
        <!-- 아이디 찾기 -->
        <section class="tab_panel" id="panel-id">
          <p class="panel_desc">가입 시 등록한 이름과 이메일을 입력해주세요.</p>
          <form id="findIdForm">
            <input type="text" id="findIdName" class="find_input" placeholder=" 이름">
            <input type="email" id="findIdEmail" class="find_input" placeholder=" 이메일">
            <div id="findIdResult"></div>
            <button type="submit" class="find_submit">아이디 찾기</button>
          </form>
        </section>

        <!-- 비밀번호 찾기 -->
        <section class="tab_panel" id="panel-pw">
          <p class="panel_desc">아이디, 이름, 이메일을 입력해 본인 확인 후 비밀번호를 재설정합니다.</p>
          <form id="findPasswordForm">
            <input type="text" id="findPwLoginId" class="find_input" placeholder=" 아이디">
            <input type="text" id="findPwName" class="find_input" placeholder=" 이름">
            <input type="email" id="findPwEmail" class="find_input" placeholder=" 이메일">
            <div id="findPasswordResult"></div>
            <button type="submit" class="find_submit">비밀번호 찾기</button>
          </form>
        </section>
      </div>

      <div id="find_footer_links">
        <a th:href="@{/login}">로그인으로 돌아가기</a>
        <a th:href="@{/users/terms}">회원가입</a>
      </div>
    </div>
  </main>
  <div th:replace="fragment/footer.html :: footer"></div>
</div>
<script th:src="@{/resources/js/nav.js}"></script>
<script th:src="@{/resources/js/findAccount.js}"></script>
</body>
</html>
