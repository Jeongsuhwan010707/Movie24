<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" th:href="@{/resources/images/logo/movie24-favicon.png}">
  <title>비밀번호 재설정</title>
  <link rel="stylesheet" th:href="@{/resources/css/include/header.css}">
  <link rel="stylesheet" th:href="@{/resources/css/include/nav.css}">
  <link rel="stylesheet" th:href="@{/resources/css/include/footer.css}">
  <link rel="stylesheet" th:href="@{/resources/css/users/findAccount.css}">
</head>
<body>
<div>
  <div th:replace="fragment/header.html :: header"></div>
  <div th:replace="fragment/nav.html :: nav"></div>
  <main>
    <div id="find_area">
      <div id="find_logo">
        <h1>비밀번호 재설정</h1>
      </div>

      <div id="find_panels">
        <section class="tab_panel active">
          <p class="panel_desc">새로 사용할 비밀번호를 입력해주세요.<br>(6~16자, 특수문자 ?!@#$% 중 1개 이상 포함)</p>
          <form th:action="@{/users/reset-password}" th:object="${resetPasswordForm}" method="post" onsubmit="return checkResetForm();">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="password" th:field="*{newPassword}" id="newPassword" class="find_input" placeholder=" 새 비밀번호">
            <input type="password" th:field="*{newPasswordConfirm}" id="newPasswordConfirm" class="find_input" placeholder=" 새 비밀번호 확인">
            <p th:if="${resetPasswordError}" th:text="${resetPasswordError}" class="find_error"></p>
            <p th:if="${#fields.hasErrors('*')}" th:errors="*{*}" class="find_error"></p>
            <button type="submit" class="find_submit">비밀번호 변경</button>
          </form>
        </section>
      </div>

      <div id="find_footer_links">
        <a th:href="@{/login}">로그인으로 돌아가기</a>
      </div>
    </div>
  </main>
  <div th:replace="fragment/footer.html :: footer"></div>
</div>
<script th:src="@{/resources/js/nav.js}"></script>
<script>
  function checkResetForm() {
    const pw = document.getElementById('newPassword').value;
    const pwc = document.getElementById('newPasswordConfirm').value;
    const specialChars = ['?', '!', '@', '#', '$', '%'];

    if (pw.length < 6 || pw.length > 16) {
      alert('비밀번호는 6글자 이상, 16글자 이하만 이용 가능합니다.');
      return false;
    }
    if (!specialChars.some(ch => pw.includes(ch))) {
      alert('?,!,@,#,$,% 의 특수문자가 1개 이상 포함되어야 합니다.');
      return false;
    }
    if (pw !== pwc) {
      alert('비밀번호가 일치하지 않습니다.');
      return false;
    }
    return true;
  }
</script>
</body>
</html>
