<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${movie.title + ' - Movie24'}">Movie24</title>
    <link rel="stylesheet" th:href="@{/resources/css/include/header.css}">
    <link rel="stylesheet" th:href="@{/resources/css/include/nav.css}">
    <link rel="stylesheet" th:href="@{/resources/css/include/footer.css}">
    <link rel="stylesheet" th:href="@{/resources/css/main/movie.css}">
</head>
<body>
<div>
    <div th:replace="fragment/header.html :: header"></div>
    <!-- 네비게이터 영역 -->
    <div th:replace="fragment/nav.html :: nav"></div>
    <main>
    <section>
        <div id="img_area"><img th:src="${movie.posterImageUrl}" th:alt="${movie.title}"></div>
        <div id="image_left">
            <div id="main_title">
                <h2 th:text="${movie.title}">영화 제목</h2>
                <span id="span1"
                      th:text="${movie.status != null and movie.status.name() == 'NOW_SHOWING'} ? '예매중'
                                : (${movie.status != null and movie.status.name() == 'COMING_SOON'} ? '상영예정' : '상영종료')">예매중</span>
                <span id="span2" th:if="${movie.status != null and movie.status.name() == 'COMING_SOON' and daysUntilRelease != null and daysUntilRelease >= 0}"
                      th:text="${'D-' + daysUntilRelease}">D-10</span>
            </div>
            <div id="main_text1">
                <p>예매율 6.4%</p>
            </div>
            <div id="main_text2">
                <p>
                    <th:block th:if="${movie.director != null}">감독 : <span th:text="${movie.director}">감독</span> / </th:block>
                    <th:block th:if="${movie.actors != null}">배우 : <span th:text="${movie.actors}">배우</span></th:block>
                    <br>
                    <th:block th:if="${movie.genre != null}">장르 : <span th:text="${movie.genre}">장르</span> / </th:block>
                    기본 정보 :
                    <span th:if="${movie.ageRating != null}" th:text="${#strings.replace(movie.ageRating.imageFileName, '.png', '')}">등급</span>,
                    <span th:if="${movie.runtimeMinutes != null}" th:text="${movie.runtimeMinutes + '분'}">러닝타임</span>,
                    <span th:if="${movie.country != null}" th:text="${movie.country}">국가</span>
                    <br th:if="${movie.releaseDate != null}">
                    <th:block th:if="${movie.releaseDate != null}">개봉 : <span th:text="${#temporals.format(movie.releaseDate, 'yyyy.MM.dd')}">개봉일</span></th:block>
                </p>
            </div>
            <button id="btn1">♥ 찜하기</button>
            <button id="btn2">★ 평점보기</button>
        </div>
    </section>
    <div id="main_menu">
        <ul>
            <li><a href="">주요정보</a></li>
            <li><a href="">예고편</a></li>
            <li><a href="">스틸컷</a></li>
            <li><a href="">평점/리뷰</a></li>
            <li><a th:href="@{/movieReservation/time(movieId=${movie.id})}">상영시간표</a></li>
        </ul>
    </div>
    <div class="title_movie">
        <p>주요정보</p>
    </div>
    <div id="title_text">
        <p th:text="${movie.synopsis ?: '영화 소개가 아직 등록되지 않았습니다.'}">영화 소개가 아직 등록되지 않았습니다.</p>
    </div>
    <div id="img_area2">
        <img src="/resources/images/표.png" alt="">
    </div>
    <a id="next" th:if="${movie.status != null and movie.status.name() == 'NOW_SHOWING'}"
       th:href="@{/movieReservation/time(movieId=${movie.id})}">예매하기</a>
    <span id="next" th:if="${movie.status != null and movie.status.name() == 'COMING_SOON'}" style="background-color:#ccc;">상영예정</span>
    <span id="next" th:if="${movie.status != null and movie.status.name() == 'ENDED'}" style="background-color:#ccc;">상영종료</span>
    <div class="title_movie">
        <p>예고편</p>
    </div>
    <div id="video_area">
        <video th:src="${movie.trailerVideoUrl ?: defaultTrailerUrl}" controls></video>
    </div>
    <div class="title_movie">
        <p>스틸컷</p>
    </div>
    <div class="title_movie">
        <p>관람평</p>
    </div>
    <div id="review">
        <h2>등록된 감상평이 아직 없습니다.</h2>
        <h1>첫 번째 감상평을 남겨주세요!</h1>
    </div>
    <div id="review_btn">
        <button>리뷰 작성</button>
    </div>
    <div id="img_area3">
        <img src="/resources/images/review2.png" alt="">
    </div>
    </main>
    <!-- --------------------푸터---------------------------------- -->
    <div th:replace="fragment/footer.html :: footer"></div>
</div>
<script th:src="@{/resources/js/nav.js}"></script>
</body>
</html>
